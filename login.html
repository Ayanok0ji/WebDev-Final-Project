<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<img class="logo" src="assets/logo.svg" alt="Discord Logo">

<div class="login-box">
  <div class="login-form">
    <h2>Welcome back!</h2>
    <p class="subtitle">We're so excited to see you again!</p>

    <form>
      <label>Email or Phone Number <span>*</span></label>
      <input type="text">

      <label>Password <span>*</span></label>
      <input type="password">

      <a href="#">Forgot your password?</a>
      
      <button type="button">Log In</button>

      <p class="register">Need an account? <a href="#">Register</a></p>

    </form>
  </div>
  <div class="qr-box">
      <img src="https://vsc.kymor.dev/api/workspaces/753d96665ec16376/chat/attachment/1790354579346747505_Screenshot2026-09-25234806.png" alt="QR code">
      <h2 class="meow"><b>Log in with QR Code</b></h2>
      <p class="scan">Scan this with the <b>Discord mobile app</b> to log in instantly.</p>
      <a class="passkey" href="#">Or, sign in with passkey</a>
  </div>
</div>
  
</body>
</html>
