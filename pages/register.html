<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <!-- discord logo -->
    <header class="header-logo">
        <a href="home.html" aria-label="Discord Home">
            <img class="logo" src="../assets/icons/logo.svg" alt="Discord Logo">
        </a>
    </header>

    <!-- register box -->
    <main class="box" role="main">

        <h2>Create an account</h2>

        <form action="login.html" method="get" onsubmit="return checkregister()">
            <!-- email -->
            <div class="form-group">
                <label for="reg-email">EMAIL <span class="required" aria-hidden="true">*</span></label>
                <input id="reg-email" name="email" type="email" autocomplete="email" required>
            </div>

            <!-- display name -->
            <div class="form-group">
                <label for="reg-display-name">DISPLAY NAME</label>
                <input id="reg-display-name" name="display_name" type="text" autocomplete="nickname">
            </div>

            <!-- username -->
            <div class="form-group">
                <label for="reg-username">USERNAME <span class="required" aria-hidden="true">*</span></label>
                <input id="reg-username" name="username" type="text" autocomplete="username" required>
            </div>

            <!-- password -->
            <div class="form-group">
                <label for="reg-password">PASSWORD <span class="required" aria-hidden="true">*</span></label>
                <input id="reg-password" name="password" type="password" autocomplete="new-password" required>
            </div>

            <!-- birthday dropdowns -->
            <div class="form-group">
                <label id="dob-label">DATE OF BIRTH <span class="required" aria-hidden="true">*</span></label>

                <div class="birth" role="group" aria-labelledby="dob-label">
                    <select id="birth-month" name="birth_month" aria-label="Birth Month" required>
                        <option value="" disabled selected hidden>Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>

                    <select id="birth-day" name="birth_day" aria-label="Birth Day" required>
                        <option value="" disabled selected hidden>Day</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>

                    <select id="birth-year" name="birth_year" aria-label="Birth Year" required>
                        <option value="" disabled selected hidden>Year</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                        <option value="2016">2016</option>
                        <option value="2015">2015</option>
                        <option value="2014">2014</option>
                        <option value="2013">2013</option>
                        <option value="2012">2012</option>
                        <option value="2011">2011</option>
                        <option value="2010">2010</option>
                        <option value="2009">2009</option>
                        <option value="2008">2008</option>
                        <option value="2007">2007</option>
                        <option value="2006">2006</option>
                        <option value="2005">2005</option>
                        <option value="2004">2004</option>
                        <option value="2003">2003</option>
                        <option value="2002">2002</option>
                        <option value="2001">2001</option>
                        <option value="2000">2000</option>
                        <option value="1999">1999</option>
                        <option value="1998">1998</option>
                        <option value="1997">1997</option>
                        <option value="1996">1996</option>
                        <option value="1995">1995</option>
                        <option value="1994">1994</option>
                        <option value="1993">1993</option>
                        <option value="1992">1992</option>
                        <option value="1991">1991</option>
                        <option value="1990">1990</option>
                    </select>
                </div>
            </div>
            
            <!-- continue button -->
            <p id="register-error" class="error"></p>
            <button type="submit">Continue</button>

            <!-- terms notice -->
            <p>
                By registering, you agree to Discord's
                <a href="terms.html">Terms of Service</a> and
                <a href="privacy.html">Privacy Policy</a>.
            </p>

            <!-- login link -->
            <a href="login.html" class="already-account">Already have an account?</a>
        </form>

    </main>
    <script src="../js/login.js"></script>
</body>
</html>
