<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <!-- discord logo -->
    <header class="header-logo">
        <a href="home.html" aria-label="Discord Home">
            <img class="logo" src="../assets/icons/logo.svg" alt="Discord Logo">
        </a>
    </header>

    <!-- login container -->
    <main class="login-box" role="main">

        <!-- login form -->
        <section class="login-form" aria-labelledby="login-heading">
            <h2 id="login-heading">Welcome back!</h2>
            <p class="subtitle">We're so excited to see you again!</p>

            <form action="home.html" method="get" onsubmit="return checklogin()">
                <!-- email -->
                <div class="form-group">
                    <label for="login-email">Email or Phone Number <span class="required" aria-hidden="true">*</span></label>
                    <input id="login-email" name="email" type="text" autocomplete="username" required>
                </div>

                <!-- password -->
                <div class="form-group">
                    <label for="login-password">Password <span class="required" aria-hidden="true">*</span></label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <!-- forgot password -->
                <div class="forgot-wrapper">
                    <a href="#" id="toggle-password" onclick="togglepassword(); return false;">Show password</a> &nbsp;|&nbsp; <a href="#">Forgot your password?</a>
                </div>

                <!-- submit button -->
                <p id="login-error" class="error"></p>
                <button type="submit">Log In</button>

                <!-- register link -->
                <p class="register">Need an account? <a href="register.html">Register</a></p>
            </form>
        </section>

        <!-- qr code box -->
        <aside class="qr-box" aria-label="QR Code Login">
            <div class="qr-code-wrapper">
                <img class="qr-img" src="../assets/images/pogi_mo_seb.png" alt="Scan QR code">
            </div>
            <h2 class="meow"><b>Log in with QR Code</b></h2>
            <p class="scan">Scan this with the <b>Discord mobile app</b> to log in instantly.</p>
            <a class="passkey" href="#">Or, sign in with passkey</a>
        </aside>

    </main>

    <script src="../js/auth.js"></script>

</body>
</html>
